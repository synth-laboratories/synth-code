scope = "repo:synth-code"

[[checks]]
id = "durable_session_inference_selection"
description = "Session settings survive recovery and preserve immutable turn profiles"
severity = "error"
require_paths = ["crates/runtime/tests/settings.rs"]
command = "python/.venv/bin/python -m unittest discover -s python/tests -p test_agent.py -k settings"
command_timeout_seconds = 20
remedy = "Restore session CAS, active-work refusal, request-profile and replay/restart witnesses; do not replace Rust settings with frontend-only labels."

[[checks]]
id = "slash_command_detach_custody"
description = "Slash exit preserves the daemon, pending approval and durable journal"
severity = "error"
require_paths = ["python/tests/test_slash_commands.py"]
command = "python/.venv/bin/python -m unittest discover -s python/tests -p test_slash_commands.py"
command_timeout_seconds = 15
remedy = "Restore the real-daemon exit/quit, pending-clear and stop regressions without terminating the owner or changing approval custody."

[[checks]]
id = "bounded_terminal_presentation"
description = "Untrusted Markdown and terminal output retain bounded rendering and partial-output notices"
severity = "error"
require_paths = ["python/src/synth_code/presentation.py", "python/tests/test_presentation.py"]
command = "python/.venv/bin/python -m unittest discover -s python/tests -p test_presentation.py"
command_timeout_seconds = 15
remedy = "Restore the bounded Markdown, malformed-input and truncated-output regressions; install the locked Python development environment if missing."

[thresholds]
max_linked_worktrees = 15
max_local_branches = 20
max_target_dir_gib = 8.0

[[checks]]
id = "pinned_public_temper_sources"
description = "Public Temper inputs and license texts match their retained provenance"
severity = "error"
require_paths = ["vendor/temper/SOURCE.json", "vendor/temper/LICENSE-MIT", "vendor/temper/LICENSE-APACHE", "Cargo.lock", "python/uv.lock"]
command = "python3 scripts/verify_sources.py"
command_timeout_seconds = 10
remedy = "Reacquire the reviewed public revision and license texts; do not replace application dependencies with private vendor sources."

[[checks]]
id = "guarded_mbx_build_entry"
description = "The local build entry keeps mbx and the maintained admission launcher"
severity = "error"
file_contains = [{ path = "scripts/build.py", pattern = "core_dev_build.py" }, { path = "scripts/build.py", pattern = "mbx" }, { path = "scripts/build.py", pattern = "--target-dir" }]
remedy = "Restore guarded mbx builds with a checkout-owned target directory."

[[checks]]
id = "workspace_effect_and_terminal_regression_custody"
description = "Approved edit and native terminal gate retain their failure/recovery witnesses"
severity = "error"
require_paths = ["crates/runtime/tests/workspace.rs", "python/tests/test_workspace_terminal.py", "tests/terminal/specs/workspace.ts", "scripts/run_bombadil.py"]
file_contains = [{ path = "crates/runtime/tests/wire.rs", pattern = "crash_after_real_edit_keeps_replacement_unknown_and_never_repeats" }, { path = "scripts/run_bombadil.py", pattern = "inject_bad_expectation" }, { path = "scripts/run_bombadil.py", pattern = "100 * 1024**2" }]
remedy = "Preserve real edit crash, denial and bounded native-terminal gate evidence; do not replace it with a browser status marker."

[[checks]]
id = "private_local_state_and_owned_test_storage"
description = "Private journal and test-directory boundary remain explicit"
severity = "error"
file_contains = [{path="crates/runtime/src/store.rs",pattern="store directory must be private and owned"},{path="crates/runtime/tests/common/mod.rs",pattern="tempfile::tempdir_in(root.canonicalize()?)"},{path="python/src/synth_code/auth.py",pattern="ACCOUNT_SCOPES=(\"offline_access\", \"user:org:read\", \"account:read\")"}]
remedy = "Preserve private local stores, checkout-owned test fixtures and read-only product account scopes."

[[checks]]
id = "native_package_source_binding"
description = "Wheels require native build inputs and binary identity to match"
severity = "error"
require_paths = ["scripts/kernel_inputs.py"]
file_contains = [{path="python/hatch_build.py",pattern="Native binary/build receipt does not match current Rust inputs"},{path="scripts/build.py",pattern="Rust inputs changed during build"}]
remedy = "Build through the guarded launcher and retain the adjacent matching native input receipt; never relabel stale native bytes."

[[checks]]
id = "release_tls_security_floors"
description = "Runtime and publisher retain the emSign incident certificate fixes"
severity = "error"
command = "python3 scripts/check_security.py"
command_timeout_seconds = 10
remedy = "Restore patched uv/certifi/sigstore/Rust trust-root inputs and requalify the selected artifacts."

[[checks]]
id = "durable_session_permission_modes"
description = "Permission modes authorize in Rust and preserve session scope and replay custody"
severity = "error"
require_paths = ["crates/runtime/tests/permissions.rs"]
command = "python/.venv/bin/python -m unittest discover -s python/tests -p test_agent.py -k permissions"
command_timeout_seconds = 20
remedy = "Restore manual default, auto-edit command approval, YOLO effects, idle-only CAS and no-repeat restart witnesses."

[[checks]]
id = "observed_session_activity"
description = "Session timing is journal-derived and completion summaries remain unique after recovery"
severity = "error"
require_paths = ["crates/runtime/tests/activity.rs", "python/tests/test_activity.py"]
command = "python/.venv/bin/python -m unittest discover -s python/tests -p test_agent.py -k activity"
command_timeout_seconds = 20
remedy = "Restore persisted-timestamp projection, read-only live elapsed status and exact once-per-turn completion/usage recovery."

[[checks]]
id = "response_copy_custody"
description = "Response copy stays bounded, preserves approval focus and never copies private continuation"
severity = "error"
require_paths = ["python/tests/test_clipboard.py"]
command = "python/.venv/bin/python -m unittest discover -s python/tests -p test_clipboard.py"
command_timeout_seconds = 15
remedy = "Restore source-targeted response copying, mouse/focus custody, control escaping and bounded clipboard-helper checks."

[[checks]]
id = "host_tool_environment_and_discovery"
description = "Host tools use OS identity and a fixed PATH while provider credentials remain stripped"
severity = "error"
require_paths = ["crates/runtime/tests/host_env.rs"]
command = "python/.venv/bin/python -m unittest discover -s python/tests -p test_commands.py"
command_timeout_seconds = 15
remedy = "Restore host-home/PATH capability discovery without inherited secrets or unbounded Docker metadata."

[[checks]]
id = "host_observation_context_and_request_order"
description = "Model requests carry observed host capabilities while user/tool messages retain provider-compatible order"
severity = "error"
command = "python/.venv/bin/python -m unittest discover -s python/tests -p test_agent.py -k host_discovery"
command_timeout_seconds = 15
remedy = "Restore runtime host observations, bounded partial discovery and actual live Beam follow-up verification before claiming the host discovery journey works."

[[checks]]
id = "single_command_preview_with_pane"
description = "Visible details own command previews while timing/status, narrow fallback and untrusted path escaping remain intact"
severity = "error"
command = "python/.venv/bin/python -m unittest discover -s python/tests -p test_activity.py"
command_timeout_seconds = 15
remedy = "Restore pane/toggle/resize/manual-status and path-control regressions."

[[checks]]
id = "unlimited_normal_turns_with_explicit_fixture_caps"
description = "Normal turns pass former count ceilings; explicit bounded profiles, cancellation and failed-turn replay remain correct"
severity = "error"
require_paths = ["crates/runtime/tests/turn_limits.rs"]
command = "python/.venv/bin/python -m unittest discover -s python/tests -p test_agent.py -k request_"
command_timeout_seconds = 30
remedy = "Restore optional request caps and no-count-cap durable model admission; do not reinstate small test ceilings on normal sessions or replay failed effects."
